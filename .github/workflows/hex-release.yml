name: Publish Elixir SDK
'on':
  release:
    types:
    - published
permissions:
  contents: read
  actions: read
concurrency:
  group: raims-elixir-hex-release
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  RAIMS_ELIXIR_TOOLKIT_REF: 2c19929ce2aed190f352f523f0d9062e42afe283
jobs:
  validateRelease:
    permissions:
      contents: write
      actions: read
    if: github.repository == 'raimshq/raims-elixir' && github.event.action == 'published' && !github.event.release.draft
      && !github.event.release.prerelease
    runs-on:
    - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    - elixir-sdk-release-check
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: Raims-Elixir
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.14
    - name: Verify release, prior validation, and approved distribution bytes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Elixir/scripts/release.py prepare --source Raims-Elixir --artifact .tmp/raims-elixir-sdk/hex-upload
    - name: Upload the approved Hex package and public provenance
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: raims-hex-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .tmp/raims-elixir-sdk/hex-upload/dist/*
          .tmp/raims-elixir-sdk/hex-upload/release-manifest.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
  publishHex:
    needs: validateRelease
    if: github.repository == 'raimshq/raims-elixir' && github.event.action == 'published' && !github.event.release.draft
      && !github.event.release.prerelease
    environment:
      name: hex
      url: https://hex.pm/packages/raims
    runs-on:
    - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    - elixir-sdk-hex-publish
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: Raims-Elixir
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.14
    - name: Download the approved Hex package from this validation job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.validateRelease.outputs.artifact_id }}
        path: .tmp/raims-elixir-sdk/hex-upload
        merge-multiple: true
        digest-mismatch: error
    - name: Verify release and approved bytes before using publishing credentials
      id: verify
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Elixir/scripts/release.py verify --source Raims-Elixir --artifact .tmp/raims-elixir-sdk/hex-upload
    - name: Verify permanent Hex publisher credential
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: python Raims-Elixir/scripts/release.py credential --source Raims-Elixir --artifact .tmp/raims-elixir-sdk/hex-upload
    - name: Publish the exact approved Hex package
      if: steps.verify.outputs.publishRequired == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: python Raims-Elixir/scripts/release.py publish --source Raims-Elixir --artifact .tmp/raims-elixir-sdk/hex-upload
    - name: Confirm the public Hex artifact bytes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Elixir/scripts/release.py confirm --source Raims-Elixir --artifact .tmp/raims-elixir-sdk/hex-upload
